name: flutter_animated_intro_flow
description: Animated interactive walkthroughs with widget or key targets, automatic playback, frequency policies, and customizable coach marks.
version: 0.1.1
repository: https://github.com/WorkWithAfridi/flutter_animated_intro
issue_tracker: https://github.com/WorkWithAfridi/flutter_animated_intro/issues

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - onboarding
  - tutorial
  - animation
  - widgets

screenshots:
  - description: Animated spotlight and coach card in the Bloom store example.
    path: doc/images/tour.png
  - description: Responsive mobile walkthrough.
    path: doc/images/mobile.png
